{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Actualizar URL y ejecutar</h1>
  <p class="muted">Guarda la URL y ejecuta la actualización de Fútbol Libre.</p>
  <label for="url">FUTBOL_LIBRE_URL</label>
  <input id="url" value="{{ current_url }}" placeholder="https://ejemplo.com/">
  <label for="extra-url">Sitio adicional manual (opcional)</label>
  <input id="extra-url" value="{{ current_extra_url }}" placeholder="https://otro-sitio.example/">
  <div class="actions">
    <button id="run" onclick="updateUrl()">Actualizar y sincronizar</button>
    <button id="run-extra" onclick="processExtra()">Procesar sitio adicional</button>
    <button id="stop" class="danger" onclick="stopUpdate()">Detener proceso actual</button>
  </div>
  <p id="status" class="status"></p>
  <div class="progress-row">
    <label for="sites-progress">Parseo de sitios <span id="sites-progress-value" class="progress-value">0%</span></label>
    <progress id="sites-progress" max="100" value="0"></progress>
    <label for="streams-progress">Extracción de m3u8 <span id="streams-progress-value" class="progress-value">0%</span></label>
    <progress id="streams-progress" max="100" value="0"></progress>
  </div>
  <pre id="tail" class="tail" aria-label="Últimas líneas del proceso"></pre>
</section>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
